<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rin — Working</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#211d15;color:#efe6cd;font-family:system-ui,sans-serif}
.box{display:flex;gap:10px;padding:10px}
img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid #2f5d3a}
h3{margin:0 0 4px;font-size:15px}
.pill{display:inline-block;background:#2f5d3a;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
.pill.waiting{background:#9c2b23}
.task{font-size:13px;line-height:1.4;margin:6px 0 0}
.dots span{animation:blink 1.2s infinite;display:inline-block}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
ul{margin:6px 0 0;padding-left:16px;font-size:12px;color:#c9bb97}
li{margin:2px 0}
small{color:#9c8f6f;font-size:11px}
</style>
</head>
<body>
<div class="box">
<img src="rin-full-body.webp" alt="Rin, the Guard" />
<div>
<h3>Rin, the Guard</h3>
<span class="pill" id="pill">Working</span>
<span class="dots" id="dots"><span>.</span><span>.</span><span>.</span></span>
<p class="task" id="task">Loading Rin's current task…</p>
<ul id="queue"></ul>
<p><small id="updated"></small></p>
</div>
</div>
<script>
async function load(){try{const r=await fetch('live-feed.json');const f=await r.json();const t=f.current_task;const pill=document.getElementById('pill');pill.textContent=t.rin_state==='waiting'?'Thinking':(t.rin_state||'Working');pill.className='pill'+(t.rin_state==='waiting'?' waiting':'');document.getElementById('task').textContent=(t.rin_state==='waiting'?'Thinking… ':'')+t.title+' — '+t.detail;document.getElementById('queue').innerHTML=f.queue.map(q=>'<li>'+q.title+' ('+q.status+')</li>').join('');document.getElementById('updated').textContent='Live feed · '+f.updated_at+' · Rin is not human.';}catch(e){document.getElementById('task').textContent='Task feed unavailable. Refresh to try again.';}}
load(); setInterval(load,30000);
</script>
</body>
</html>
